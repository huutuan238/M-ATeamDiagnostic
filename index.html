<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MergeQuest – Hành trình trở thành lãnh đạo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Nunito", system-ui, sans-serif;
        background: #2a3b5c;
        color: #eef3fb;
        overflow: hidden;
      }
      #cv {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .fld {
        width: 100%;
        margin-top: 0.25rem;
        border-radius: 0.9rem;
        background: #1c2a47;
        border: 2px solid #34476b;
        padding: 0.6rem 0.9rem;
        font-weight: 600;
      }
      .fld:focus {
        border-color: #f2b84b;
        outline: none;
      }
      .btn {
        background: #f2b84b;
        color: #1b2436;
        font-weight: 900;
        border-radius: 1rem;
        box-shadow: 0 5px 0 #b57f16;
        transition: transform 0.1s, box-shadow 0.1s;
      }
      .btn:hover {
        background: #f7c862;
      }
      .btn:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #b57f16;
      }
      .opt {
        background: #2b3c5f;
        border: 2px solid #3b4f78;
        box-shadow: 0 4px 0 #1a2640;
        transition: transform 0.12s, border-color 0.12s;
      }
      .opt:hover:not([disabled]) {
        border-color: #f2b84b;
        transform: translateY(-2px);
      }
      .opt:active:not([disabled]) {
        transform: translateY(2px);
        box-shadow: 0 1px 0 #1a2640;
      }
      .opt.sel {
        border-color: #f2b84b;
        background: #3a4f7c;
      }
      .opt.dim {
        opacity: 0.45;
      }
      button:focus-visible,
      .fld:focus-visible {
        outline: 3px solid #8ec5f0;
        outline-offset: 2px;
      }
      @keyframes pop {
        from {
          transform: scale(0.92);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .pop {
        animation: pop 0.25s ease-out;
      }
      #fade {
        position: fixed;
        inset: 0;
        background: #16213a;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.45s;
      }
      #rep {
        background: #f4f6f9;
        color: #1f2a3d;
      }
      .bar {
        height: 10px;
        border-radius: 5px;
        background: #dde3ec;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: #4f6d9a;
      }
      /* Thanh tiến độ theo số câu hỏi */
      #pbar {
        display: flex;
        gap: 4px;
        flex: 1;
      }
      #pbar i {
        flex: 1;
        height: 10px;
        border-radius: 5px;
        background: #4a5a7a;
        transition: background 0.3s;
      }
      #pbar i.done {
        background: #6ee7b7;
      }
      #pbar i.cur {
        background: #f2b84b;
      }
      @media print {
        #cv,
        .np,
        #hud,
        #panel,
        #fade {
          display: none !important;
        }
        body {
          overflow: visible;
          background: #fff;
        }
        #rep {
          position: static !important;
          overflow: visible !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="cv"></canvas>

    <!-- MÀN HÌNH 1: TITLE + ONBOARDING -->
    <section
      id="onb"
      class="fixed inset-0 z-30 overflow-y-auto"
      style="
        background: linear-gradient(
          rgba(22, 33, 58, 0.35),
          rgba(22, 33, 58, 0.93) 60%
        );
      "
    >
      <div
        class="min-h-full flex flex-col items-center justify-center p-4 gap-5"
      >
        <div class="text-center">
          <div
            class="inline-block rounded-full bg-amber-300 text-slate-900 font-black text-xs px-3 py-1 mb-2"
          >
            MergeQuest · Masan × VinCommerce
          </div>
          <h1 class="text-3xl md:text-5xl font-black text-white">
            Hành trình trở thành lãnh đạo
          </h1>
          <p class="text-slate-300 font-semibold mt-2 max-w-md mx-auto text-sm">
            Dẫn dắt nhóm tích hợp M&amp;A qua <span id="nq">6</span> chặng.
            Không có đúng hay sai tuyệt đối, mỗi quyết định cho thấy phong cách
            lãnh đạo của bạn.
          </p>
        </div>
        <form
          id="f"
          class="w-full max-w-md rounded-3xl p-6 space-y-3"
          style="
            background: #22304e;
            border: 2px solid #34476b;
            box-shadow: 0 8px 0 #141d33;
          "
        >
          <label class="block text-sm font-extrabold"
            >Họ và tên<input
              id="nm"
              required
              class="fld"
              placeholder="Nguyễn Văn A"
          /></label>
          <label class="block text-sm font-extrabold"
            >Chức vụ hiện tại
            <select id="ps" class="fld">
              <option>Chuyên viên / Senior Specialist</option>
              <option>Trưởng nhóm / Team Lead</option>
              <option>Quản lý / Manager</option>
              <option>Giám đốc / C-Suite / Executive</option>
              <option>Khác</option>
            </select></label
          >
          <label class="block text-sm font-extrabold"
            >Mục tiêu sự nghiệp
            <input
              id="gl"
              required
              list="gls"
              class="fld"
              placeholder="VD: Trở thành IMO Lead" />
            <datalist id="gls">
              <option
                value="Trở thành Giám đốc Tích hợp M&A (IMO Lead)"
              ></option>
              <option value="Lên vị trí Quản lý Khối"></option>
              <option value="Điều hành chuỗi bán lẻ"></option></datalist
          ></label>
          <label class="block text-sm font-extrabold"
            >Thời gian kỳ vọng
            <select id="tl" class="fld">
              <option value="0.5">6 tháng</option>
              <option value="1">1 năm</option>
              <option value="2" selected>2 năm</option>
              <option value="4">3 - 5 năm</option>
            </select></label
          >
          <button class="btn w-full py-3 text-lg mt-2">Bắt đầu</button>
        </form>
      </div>
    </section>

    <!-- HUD + PANEL -->
    <div id="hud" class="fixed top-0 inset-x-0 z-10 p-3 hidden">
      <div class="max-w-4xl mx-auto flex items-center gap-3">
        <div
          id="hph"
          class="shrink-0 rounded-full px-4 py-1.5 bg-slate-900/70 font-black text-amber-300 text-sm"
        ></div>
        <div
          id="pbar"
          role="progressbar"
          aria-label="Tiến độ câu hỏi"
          aria-valuemin="0"
        ></div>
        <div
          id="hq"
          class="shrink-0 text-xs font-extrabold bg-slate-900/70 rounded-full px-3 py-1.5"
        ></div>
        <div
          id="hwk"
          class="shrink-0 text-xs font-extrabold bg-slate-900/70 rounded-full px-3 py-1.5 max-sm:hidden"
        ></div>
      </div>
    </div>
    <aside
      id="panel"
      class="z-10 fixed hidden inset-x-0 bottom-0 overflow-y-auto p-4 md:p-6 max-h-[58vh] md:max-h-[52vh] rounded-t-3xl"
      style="
        background: linear-gradient(#22304ef0, #16213af7);
        border-top: 3px solid #f2b84b66;
      "
    ></aside>
    <div id="fade"></div>

    <!-- MÀN HÌNH 8: BÁO CÁO -->
    <section
      id="rep"
      class="fixed inset-0 z-40 overflow-y-auto hidden"
    ></section>

    <!-- Dữ liệu câu hỏi và đáp án (const S) -->
    <script src="questions.js"></script>

    <script>
      /* ====== CẤU HÌNH CHẤM ĐIỂM (S được nạp từ questions.js) ====== */
      /* Điểm mỗi câu theo mức phù hợp; tổng được chuẩn hóa về thang 100 theo số câu hỏi */
      const PTS = { 4: 16.67, 3: 12, 2: 8, 1: 4 };
      const TRAIT = {
        D: ["Decisive", "Quyết đoán, ra quyết định nhanh và nhận trách nhiệm."],
        E: ["Empathetic", "Thấu cảm, đặt con người và lòng tin ở trung tâm."],
        S: [
          "System-builder",
          "Kiến tạo hệ thống, quy trình và cấu trúc rõ ràng.",
        ],
        P: ["Empowering", "Trao quyền, tin tưởng nhóm tự chủ."],
      };
      const $ = (id) => document.getElementById(id);
      const G = { idx: 0, ans: [], info: {} };
      $("nq").textContent = S.length;

      /* ====== THANH TIẾN ĐỘ THEO SỐ CÂU HỎI ====== */
      function prog(i, answered) {
        const n = S.length,
          done = i + (answered ? 1 : 0);
        $("pbar").innerHTML = S.map(
          (_, k) =>
            `<i class="${k < done ? "done" : k === i ? "cur" : ""}"></i>`
        ).join("");
        $("pbar").setAttribute("aria-valuemax", n);
        $("pbar").setAttribute("aria-valuenow", done);
        $("hq").textContent = `Câu ${i + 1}/${n}`;
      }

      /* ====== THREE.JS VOXEL ENGINE ====== */
      const cv = $("cv"),
        R = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
      R.setPixelRatio(Math.min(devicePixelRatio, 2));
      R.shadowMap.enabled = true;
      const sc = new THREE.Scene();
      sc.background = new THREE.Color("#2a3b5c");
      const cam = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
      sc.add(new THREE.AmbientLight("#dfe8f5", 0.75));
      const dl = new THREE.DirectionalLight("#fff1d6", 0.8);
      dl.position.set(8, 14, 6);
      dl.castShadow = true;
      dl.shadow.mapSize.set(1024, 1024);
      Object.assign(dl.shadow.camera, {
        left: -12,
        right: 12,
        top: 12,
        bottom: -12,
        far: 45,
      });
      sc.add(dl);
      const root = new THREE.Group();
      sc.add(root);
      const MC = {};
      const mat = (c) =>
        MC[c] || (MC[c] = new THREE.MeshLambertMaterial({ color: c }));
      const bx = (g, w, h, d, c, x, y, z) => {
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, d),
          typeof c === "string" ? mat(c) : c
        );
        m.position.set(x, y, z);
        m.castShadow = m.receiveShadow = true;
        g.add(m);
        return m;
      };
      const C = {
        slate: "#6f8fbd",
        sky: "#9ec5e6",
        mint: "#8fd3bb",
        amber: "#f2b84b",
        wood: "#c9a27a",
        floor: "#d5dde9",
        wall: "#eef2f8",
        dark: "#2f3b55",
        white: "#f7f8fb",
        skin: "#f3cfae",
        red: "#e06b64",
      };
      function person(shirt, hair, pants = "#3a465c") {
        const g = new THREE.Group(),
          sk = C.skin;
        const m = (geo, c, x, y, z, p) => {
          const o = new THREE.Mesh(geo, mat(c));
          o.position.set(x, y, z);
          o.castShadow = true;
          (p || g).add(o);
          return o;
        };
        const leg = (x) => {
          const p = new THREE.Group();
          p.position.set(x, 0.8, 0);
          m(
            new THREE.CylinderGeometry(0.14, 0.12, 0.8, 12),
            pants,
            0,
            -0.4,
            0,
            p
          );
          m(new THREE.SphereGeometry(0.15, 10, 8), "#222a3a", 0, -0.8, 0.05, p);
          g.add(p);
          return p;
        };
        const arm = (x) => {
          const p = new THREE.Group();
          p.position.set(x, 1.6, 0);
          m(
            new THREE.CylinderGeometry(0.1, 0.09, 0.7, 10),
            shirt,
            0,
            -0.3,
            0,
            p
          );
          m(new THREE.SphereGeometry(0.1, 10, 8), sk, 0, -0.7, 0, p);
          g.add(p);
          return p;
        };
        const L = leg(-0.16),
          Rr = leg(0.16);
        m(new THREE.CylinderGeometry(0.32, 0.36, 0.85, 16), shirt, 0, 1.2, 0);
        m(new THREE.BoxGeometry(0.1, 0.5, 0.03), "#2b3446", 0, 1.25, 0.345);
        const A = arm(-0.46),
          B = arm(0.46);
        m(new THREE.SphereGeometry(0.28, 18, 14), sk, 0, 1.92, 0);
        m(
          new THREE.SphereGeometry(
            0.3,
            18,
            12,
            0,
            Math.PI * 2,
            0,
            Math.PI * 0.55
          ),
          hair,
          0,
          1.95,
          -0.02
        );
        m(new THREE.SphereGeometry(0.035, 8, 6), "#222", -0.1, 1.95, 0.265);
        m(new THREE.SphereGeometry(0.035, 8, 6), "#222", 0.1, 1.95, 0.265);
        g.userData = { L, R: Rr, A, B };
        return g;
      }
      let npcs = [],
        pl = null,
        T0 = 0;
      function npc(x, z, ry, shirt, hair, mode) {
        const p = person(shirt, hair);
        p.position.set(x, 0, z);
        p.rotation.y = ry;
        root.add(p);
        npcs.push({ p, mode, ph: Math.random() * 6 });
        return p;
      }
      function scene3d(i) {
        root.clear();
        npcs = [];
        bx(root, 16, 0.4, 16, C.floor, 0, -0.2, 0);
        bx(root, 13, 0.04, 13, "#e4eaf3", 0, 0.02, 0);
        bx(root, 16, 5, 0.3, C.wall, 0, 2.5, -8);
        bx(root, 0.3, 5, 16, "#dfe6f1", -8, 2.5, 0);
        bx(root, 16, 0.25, 0.4, C.slate, 0, 0.12, -7.8);
        let tx = 3.5,
          tz = 0,
          ry = -Math.PI / 2,
          mode = "idle";
        if (i === 0) {
          bx(root, 5, 0.9, 2.2, C.wood, 0, 0.45, 0);
          for (let k = 0; k < 16; k++) {
            const m = bx(
              root,
              0.6,
              0.04,
              0.8,
              C.white,
              Math.random() * 4.2 - 2.1,
              0.92 + k * 0.01,
              Math.random() * 1.6 - 0.8
            );
            m.rotation.y = Math.random() * 3;
          }
          npc(-1.3, -2, 0, C.slate, "#2b3446");
          npc(1.3, -2, 0, C.slate, "#4a3a2e");
          npc(-1.3, 2, Math.PI, C.amber, "#2b3446");
          npc(1.3, 2, Math.PI, C.amber, "#6b4a2e");
          tx = 4;
        } else if (i === 1) {
          bx(root, 6, 0.9, 2.4, C.wood, 0, 0.45, 0);
          bx(root, 0.5, 0.5, 0.5, C.red, -1, 1.15, 0);
          bx(root, 0.5, 0.5, 0.5, C.red, 1.2, 1.15, 0.3);
          npc(-1.8, -2.1, 0, C.slate, "#2b3446", "slam");
          npc(1.8, -2.1, 0, C.slate, "#4a3a2e", "talk");
          npc(-1.8, 2.1, Math.PI, C.amber, "#2b3446", "talk");
          npc(1.8, 2.1, Math.PI, C.amber, "#6b4a2e", "slam");
          tx = 4.6;
        } else if (i === 2) {
          bx(root, 11, 4, 0.3, C.dark, 0, 3, -7.6);
          window.alarm = new THREE.MeshLambertMaterial({
            color: "#d2605a",
            emissive: "#7a1f1c",
          });
          bx(root, 3.4, 1.2, 0.15, window.alarm, 0, 4.2, -7.4);
          for (let k = 0; k < 10; k++)
            bx(
              root,
              0.9,
              0.6,
              0.15,
              k < 3 ? C.red : k < 5 ? C.amber : "#4a5873",
              -4.5 + k * 1,
              2.2,
              -7.4
            );
          for (let k = 0; k < 9; k++)
            bx(
              root,
              0.7,
              0.25,
              0.15,
              k < 5 ? C.amber : "#4a5873",
              -4 + k * 1,
              1.4,
              -7.4
            );
          npc(-3, -3.5, 0, C.slate, "#2b3446", "idle");
          npc(3, -3.5, 0, C.amber, "#4a3a2e", "idle");
          npc(-1.5, -3.5, 0, C.sky, "#6b4a2e", "idle");
          tx = 0;
          tz = -2;
          ry = Math.PI;
        } else if (i === 3) {
          bx(root, 4.4, 0.9, 1.8, C.wood, 0, 0.45, 0);
          bx(root, 1.8, 1.1, 0.1, C.dark, 0, 1.6, -0.5);
          bx(root, 1.6, 0.9, 0.05, C.mint, 0, 1.6, -0.45);
          npc(-0.7, 1.4, Math.PI, C.slate, "#2b3446", "type");
          npc(0.7, 1.4, Math.PI, C.amber, "#4a3a2e", "type");
          bx(root, 2, 0.9, 1.2, C.wood, -4, 0.45, -4);
          bx(root, 1, 0.7, 0.1, C.dark, -4, 1.4, -4.3);
          tx = 3.8;
          tz = 1.4;
        } else if (i === 4) {
          const cols = [C.red, C.amber, C.sky, C.mint, "#ffffff", C.slate];
          for (let s = -1; s <= 1; s += 2)
            for (let l = 0; l < 3; l++) {
              bx(root, 6, 0.12, 1.2, C.wood, s * 4, 0.5 + l * 1.2, -6.8);
              for (let k = 0; k < 7; k++)
                bx(
                  root,
                  0.6,
                  0.7,
                  0.6,
                  cols[(k + l + (s > 0 ? 1 : 0)) % 6],
                  s * 4 - 2.5 + k * 0.85,
                  0.95 + l * 1.2,
                  -6.8
                );
            }
          bx(root, 0.12, 4, 1.2, C.wood, -7.1, 2, -6.8);
          bx(root, 0.12, 4, 1.2, C.wood, 7.1, 2, -6.8);
          npc(0, -3, 0, C.amber, "#2b3446", "talk");
          npc(-2.2, 0, Math.PI, C.slate, "#4a3a2e", "idle");
          npc(2.2, 0, Math.PI, C.sky, "#2b3446", "idle");
          tx = 0;
          tz = 3.2;
          ry = Math.PI;
        } else {
          bx(root, 1.4, 1.2, 0.9, C.wood, 0, 0.6, -3.5);
          bx(root, 0.5, 0.04, 0.7, C.white, 0, 1.24, -3.5);
          bx(root, 9, 1.4, 0.12, C.amber, 0, 4.1, -7.7);
          bx(root, 8, 0.2, 0.12, C.white, 0, 4.1, -7.6);
          [-4, -2, 2, 4].forEach((x, k) =>
            npc(
              x,
              0,
              Math.PI,
              [C.slate, C.amber, C.sky, C.mint][k],
              "#2b3446",
              "clap"
            )
          );
          tx = 0;
          tz = -1.6;
          ry = Math.PI;
          mode = "clap";
        }
        const p = person("#f2b84b", "#2b3446", "#2f3a50");
        p.position.set(-6.4, 0, tz);
        p.rotation.y = Math.PI / 2;
        root.add(p);
        pl = { p, tx, tz, ry, mode, walking: true };
      }
      function anim(t) {
        npcs.forEach((n) => {
          const u = n.p.userData,
            s = t * 3 + n.ph;
          u.A.rotation.x = u.B.rotation.x = 0;
          u.A.rotation.z = u.B.rotation.z = 0;
          if (n.mode === "slam") {
            u.B.rotation.x = -1.4 + Math.sin(t * 9 + n.ph) * 0.7;
          } else if (n.mode === "talk") {
            u.A.rotation.x = -0.9 + Math.sin(s) * 0.35;
            u.B.rotation.x = -0.6 + Math.cos(s * 1.2) * 0.3;
          } else if (n.mode === "type") {
            u.A.rotation.x = -1.2 + Math.sin(t * 14 + n.ph) * 0.1;
            u.B.rotation.x = -1.2 + Math.cos(t * 13) * 0.1;
          } else if (n.mode === "clap") {
            const c = Math.abs(Math.sin(t * 6 + n.ph));
            u.A.rotation.x = u.B.rotation.x = -1.3;
            u.A.rotation.z = -0.25 + c * 0.5;
            u.B.rotation.z = 0.25 - c * 0.5;
          } else {
            u.A.rotation.x = Math.sin(s * 0.5) * 0.06;
            n.p.position.y = Math.sin(s * 0.8) * 0.02;
          }
        });
        if (pl) {
          const u = pl.p.userData,
            p = pl.p;
          if (pl.walking) {
            const dx = pl.tx - p.position.x;
            if (Math.abs(dx) < 0.08) {
              pl.walking = false;
              p.rotation.y = pl.ry;
              u.L.rotation.x = u.R.rotation.x = 0;
            } else {
              p.position.x += Math.sign(dx) * 0.045;
              const w = Math.sin(t * 10) * 0.7;
              u.L.rotation.x = w;
              u.R.rotation.x = -w;
              u.A.rotation.x = -w * 0.6;
              u.B.rotation.x = w * 0.6;
            }
          } else if (pl.mode === "clap") {
            const c = Math.abs(Math.sin(t * 6));
            u.A.rotation.x = u.B.rotation.x = -1.3;
            u.A.rotation.z = -0.25 + c * 0.5;
            u.B.rotation.z = 0.25 - c * 0.5;
          } else {
            u.A.rotation.x = Math.sin(t * 1.6) * 0.08;
            u.B.rotation.x = -0.3 + Math.sin(t * 2) * 0.12;
            p.position.y = Math.sin(t * 2) * 0.02;
          }
        }
        if (window.alarm && G.idx === 2)
          window.alarm.emissive.setScalar(0.25 + 0.25 * Math.sin(t * 5) + 0.2);
      }
      function resize() {
        R.setSize(innerWidth, innerHeight, false);
        cam.aspect = innerWidth / innerHeight;
        const m = innerWidth < 768;
        cam.position.set(m ? 16 : 12, m ? 14 : 10, m ? 16 : 12);
        cam.lookAt(0, 1.2, 0);
        cam.aspect = innerWidth / innerHeight;
        cam.setViewOffset(
          innerWidth,
          innerHeight,
          0,
          innerHeight * (m ? 0.3 : 0.2),
          innerWidth,
          innerHeight
        );
      }
      addEventListener("resize", resize);
      resize();
      (function loop(ts) {
        T0 = ts / 1000;
        anim(T0);
        R.render(sc, cam);
        requestAnimationFrame(loop);
      })(0);
      scene3d(0);

      /* ====== LUỒNG GAME ====== */
      function fadeTo(fn) {
        const f = $("fade");
        f.style.opacity = 1;
        setTimeout(() => {
          fn();
          f.style.opacity = 0;
        }, 470);
      }
      $("f").addEventListener("submit", (e) => {
        e.preventDefault();
        G.info = {
          name: $("nm").value.trim(),
          pos: $("ps").value,
          goal: $("gl").value.trim(),
          tl: +$("tl").value,
          tlTxt: $("tl").selectedOptions[0].text,
        };
        fadeTo(() => {
          $("onb").classList.add("hidden");
          $("hud").classList.remove("hidden");
          $("panel").classList.remove("hidden");
          load(0);
        });
      });
      function load(i) {
        G.idx = i;
        scene3d(i);
        const s = S[i];
        $("hph").textContent = s.ph;
        $("hwk").textContent = s.wk;
        prog(i, false);
        const cl = ["#f2b84b", "#8ec5f0", "#8fd3bb", "#f0a4b8"];
        const opts = s.o
          .map((o, k) => ({ o, k }))
          .sort(() => Math.random() - 0.5);
        $("panel").scrollTop = 0;
        $("panel").innerHTML = `<div class="max-w-4xl mx-auto pop">
   <div class="flex gap-3 items-center mb-3"><div class="shrink-0 rounded-2xl bg-slate-700 px-3 py-2 text-xs font-extrabold text-sky-200">Câu ${
     i + 1
   }/${S.length}</div><p class="text-sm font-semibold text-slate-300">${
          s.ctx
        }</p></div>
   <h2 class="text-base md:text-xl font-black leading-snug mb-4">${s.q}</h2>
   <div class="grid md:grid-cols-2 gap-3">${opts
     .map(
       ({ o, k }, n) =>
         `<button data-k="${k}" class="opt flex gap-3 items-start text-left rounded-2xl p-3"><span class="shrink-0 w-8 h-8 rounded-xl grid place-items-center font-black text-slate-900" style="background:${
           cl[n]
         }">${
           "ABCD"[n]
         }</span><span class="text-sm font-semibold leading-snug">${
           o[0]
         }</span></button>`
     )
     .join("")}</div>
   <div id="fb"></div></div>`;
        document
          .querySelectorAll(".opt")
          .forEach((b) => (b.onclick = () => pick(+b.dataset.k, b)));
      }
      function pick(k, btn) {
        const s = S[G.idx],
          o = s.o[k],
          l = o[1],
          last = G.idx === S.length - 1;
        G.ans[G.idx] = k;
        prog(G.idx, true);
        document.querySelectorAll(".opt").forEach((b) => {
          b.disabled = true;
          b.classList.add(b === btn ? "sel" : "dim");
        });
        $(
          "fb"
        ).innerHTML = `<div class="pop mt-4 rounded-2xl p-4 flex flex-wrap items-center gap-4" style="background:#16213a;border:2px solid #3b4f78">
   <div class="text-center"><div class="text-2xl tracking-widest text-amber-300">${"★".repeat(
     l
   )}<span class="text-slate-600">${"★".repeat(
          4 - l
        )}</span></div><div class="text-xs font-extrabold text-slate-300">Mức phù hợp ${l}/4</div></div>
   <p class="flex-1 min-w-[12rem] text-sm font-semibold text-slate-200"><b class="text-sky-200">Góc nhìn tâm lý:</b> ${
     o[3]
   }</p>
   <button id="nx" class="btn px-6 py-2.5">${
     last ? "Xem báo cáo" : "Câu tiếp theo"
   }</button></div>`;
        $("nx").onclick = () =>
          fadeTo(() => (last ? report() : load(G.idx + 1)));
        $("panel").scrollTo({
          top: $("panel").scrollHeight,
          behavior: "smooth",
        });
      }

      /* ====== BÁO CÁO EXECUTIVE ====== */
      const fmt = (y) =>
        y < 1
          ? Math.max(1, Math.round(y * 12)) + " tháng"
          : +y.toFixed(1) + " năm";
      function report() {
        const lv = G.ans.map((k, i) => S[i].o[k][1]),
          score = Math.min(
            100,
            Math.round(lv.reduce((a, l) => a + PTS[l], 0) * (6 / S.length))
          ),
          I = G.info;
        const cls =
          score >= 85
            ? [
                "PMI Master",
                "Chuyên gia Tích hợp M&A & Lãnh đạo Linh hoạt",
                "Làm chủ Tuckman, Hersey-Blanchard và an toàn tâm lý.",
              ]
            : score >= 70
            ? [
                "Emerging Leader",
                "Nhà Quản lý Tiềm năng",
                "Nắm chắc lý thuyết, cần rèn thêm kỹ năng xử lý điểm khủng hoảng Midpoint (Gersick).",
              ]
            : score >= 50
            ? [
                "Transactional Manager",
                "Nhà Quản lý Cứng nhắc",
                "Dễ sa vào áp đặt hoặc né tránh khi Storming bùng nổ.",
              ]
            : [
                "Operational Lead",
                "Cấp Quản lý Cơ bản",
                "Cần bổ sung toàn diện tư duy quản trị thay đổi và M&A.",
              ];
        const tr = { D: 0, E: 0, S: 0, P: 0 };
        G.ans.forEach((k, i) => {
          const o = S[i].o[k];
          tr[o[2]] += o[1];
        });
        const top = Object.keys(tr).sort((a, b) => tr[b] - tr[a])[0];
        const avg = (ix) => {
          ix = ix.filter((i) => i < lv.length);
          return ix.length
            ? (ix.reduce((a, i) => a + lv[i], 0) / ix.length / 4) * 100
            : 0;
        };
        const ax = [
          [
            "Thái độ với xung đột (đối thoại gốc rễ vs né tránh/áp đặt)",
            avg([1, 2, 3]),
          ],
          ["Mức độ kiểm soát (trao quyền vs kiểm soát vi mô)", avg([0, 3, 4])],
          [
            "Kiến tạo an toàn tâm lý (lòng tin nhóm vs chỉ tiêu ngắn hạn)",
            avg([1, 2, 5]),
          ],
        ];
        const strong = lv
          .map((l, i) => [l, i])
          .filter((x) => x[0] === 4)
          .map((x) => x[1]);
        const minL = Math.min(...lv),
          weak = lv
            .map((l, i) => [l, i])
            .filter((x) => x[0] === minL)
            .map((x) => x[1]);
        const Z = I.tl;
        let fc;
        if (score >= 85)
          fc = `Bạn đã sở hữu tư duy lãnh đạo M&A xuất sắc. Dự báo bạn có thể đạt mục tiêu “${
            I.goal
          }” trong khoảng <b>${fmt(0.6 * Z)} – ${fmt(
            0.8 * Z
          )}</b> (sớm hơn kỳ vọng ${I.tlTxt}).`;
        else if (score >= 70)
          fc = `Bạn có tiềm năng tốt. Dự báo bạn sẽ đạt mục tiêu “${I.goal}” đúng hạn <b>${I.tlTxt}</b> sau khi tối ưu hóa kỹ năng xử lý điểm khủng hoảng Midpoint.`;
        else
          fc = `Bạn hiện chưa thực sự đủ khả năng làm lãnh đạo M&A/dự án phức tạp; rủi ro thất bại do áp đặt hoặc né tránh xung đột khá cao. Dự báo bạn cần <b>${fmt(
            1.5 * Z
          )} – ${fmt(
            2 * Z
          )}</b> và hoàn thành các khuyến nghị luyện tập để đạt mục tiêu “${
            I.goal
          }”.`;
        const bar = (l, v, c) =>
          `<div class="mb-3"><div class="flex justify-between text-sm mb-1"><span>${l}</span><b>${Math.round(
            v
          )}%</b></div><div class="bar"><i style="width:${v}%;${
            c ? "background:" + c : ""
          }"></i></div></div>`;
        const sec = (t) =>
          `<h2 class="text-lg font-bold mt-8 mb-3 border-b border-slate-300 pb-1">${t}</h2>`;
        $("rep").innerHTML = `<div class="max-w-3xl mx-auto p-5 md:p-10">
   <div class="np flex justify-end gap-2 mb-4"><button onclick="print()" class="rounded bg-slate-800 text-white px-4 py-2 text-sm">In / Lưu PDF</button><button onclick="location.reload()" class="rounded border border-slate-400 px-4 py-2 text-sm">Chơi lại</button></div>
   <h1 class="text-2xl md:text-3xl font-extrabold">Executive Leadership Assessment Report</h1>
   <p class="text-slate-600 text-sm">MergeQuest: Masan – VinCommerce (2019–2021) · ${new Date().toLocaleDateString(
     "vi-VN"
   )}</p>
   <div class="mt-5 rounded-lg bg-slate-800 text-white p-5 flex flex-wrap items-center gap-5">
     <div class="text-6xl font-extrabold text-amber-300">${score}<span class="text-xl text-slate-300">/100</span></div>
     <div class="min-w-[14rem] flex-1"><div class="text-xl font-bold">${
       cls[0]
     }</div><div class="text-sky-200">${
          cls[1]
        }</div><p class="text-sm text-slate-300 mt-1">${cls[2]}</p></div></div>
   ${sec("1. Mức độ thấu hiểu mô hình Tuckman theo từng giai đoạn")}
   ${S.map((s, i) =>
     bar(
       `${s.ph} (${s.wk}) – Level ${lv[i]}/4`,
       (lv[i] / 4) * 100,
       lv[i] === 4
         ? "#3f9b7b"
         : lv[i] === 3
         ? "#4f6d9a"
         : lv[i] === 2
         ? "#d29a2f"
         : "#c0504d"
     )
   ).join("")}
   ${sec("2. Phân tích tâm lý quản trị")}
   <p class="text-sm mb-3">Thiên hướng nổi bật: <b>${TRAIT[top][0]}</b>. ${
          TRAIT[top][1]
        } (Điểm theo thiên hướng: ${Object.entries(tr)
          .map(([k, v]) => TRAIT[k][0] + " " + v)
          .join(
            " · "
          )}). Đây là chỉ báo xu hướng, không phải kết luận tuyệt đối.</p>
   ${ax.map((a) => bar(a[0], a[1])).join("")}
   <ul class="text-sm space-y-1 mt-2">${G.ans
     .map((k, i) => `<li><b>${S[i].ph}:</b> ${S[i].o[k][3]}</li>`)
     .join("")}</ul>
   ${sec("3. Điểm mạnh")}
   <p class="text-sm">${
     strong.length
       ? "Bạn xử lý tốt ở: " +
         strong
           .map((i) => `<b>${S[i].ph}</b> (${S[i].k.toLowerCase()})`)
           .join("; ") +
         "."
       : "Chưa có tình huống đạt Level 4. Điểm sáng nhất là các lựa chọn Level " +
         Math.max(...lv) +
         "; hãy xây tiếp từ đó."
   }</p>
   ${sec("4. Khuyến nghị cải thiện và luyện tập")}
   <p class="text-sm mb-2">Kỹ năng ưu tiên cải thiện: ${weak
     .map((i) => `<b>${S[i].ph}</b> – ${S[i].k}`)
     .join("; ")}.</p>
   <ul class="list-disc pl-5 text-sm space-y-1"><li>Thiết lập Ma trận RACI cho một dự án thực tế của bạn.</li><li>Áp dụng nguyên tắc “Phân – Bổ – Luật – Dẫn” khi làm việc với nhân sự Shaper (Belbin).</li><li>Thực hành lắng nghe chủ động và phân loại xung đột Task vs Relationship.</li></ul>
   ${sec("5. Kết luận khách quan và dự báo mục tiêu cá nhân")}
   <table class="w-full text-sm mb-3"><tr><td class="py-1 text-slate-500 w-40">Họ tên</td><td>${
     I.name
   }</td></tr><tr><td class="py-1 text-slate-500">Chức vụ hiện tại</td><td>${
          I.pos
        }</td></tr><tr><td class="py-1 text-slate-500">Mục tiêu sự nghiệp</td><td>${
          I.goal
        }</td></tr><tr><td class="py-1 text-slate-500">Thời gian kỳ vọng</td><td>${
          I.tlTxt
        }</td></tr></table>
   <div class="rounded-lg bg-white border border-slate-300 p-4 text-sm">${fc}</div>
   <p class="text-xs text-slate-500 mt-6">Cơ sở lý thuyết: Tuckman (1965, 1977), Hersey-Blanchard, Edmondson, Gersick, Belbin. Kết quả mang tính giáo dục, dựa trên ${
     S.length
   } tình huống mô phỏng.</p></div>`;
        $("hud").classList.add("hidden");
        $("panel").classList.add("hidden");
        $("rep").classList.remove("hidden");
        $("rep").scrollTop = 0;
      }
    </script>
  </body>
</html>
